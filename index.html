<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#141519" />
    <title>ABSolid — 10분의 꾸준함이 만드는 단단함</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ABSolid" />
    <script>
      // 화면 테마를 첫 그림 전에 적용 (깜빡임 방지). 키·규칙은 src/storage.js, src/theme.js 와 같게 유지
      ;(function () {
        var mode = null
        try {
          mode = localStorage.getItem('absolid-theme')
        } catch (e) {}
        var sys = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)')
        // 기본값 다크: 'light' 는 라이트, 'system' 은 휴대폰 설정, 그 외(없음 포함)는 다크
        var dark = mode !== 'light' && !(mode === 'system' && sys && !sys.matches)
        var root = document.documentElement
        root.dataset.theme = dark ? 'dark' : 'light'
        root.style.colorScheme = dark ? 'dark' : 'light'
        document.querySelector('meta[name="theme-color"]').content = dark ? '#141519' : '#f5f6f8'
        document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').content = dark
          ? 'black-translucent'
          : 'default'
      })()
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
